<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradForest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D3E" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>
    <linearGradient id="gradWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDA15E" />
      <stop offset="100%" stop-color="#BC6C25" />
    </linearGradient>
  </defs>

  <!-- Icon Container -->
  <g transform="translate(10, 10)">
    <!-- Shield / Badge Background -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#gradForest)" />
    
    <!-- Geometric Truck & Timber Logs Graphic -->
    <!-- Log Stack -->
    <!-- Bottom row logs -->
    <circle cx="34" cy="56" r="11" fill="none" stroke="#DDA15E" stroke-width="3" />
    <circle cx="34" cy="56" r="4" fill="#DDA15E" />
    <circle cx="56" cy="56" r="11" fill="none" stroke="#DDA15E" stroke-width="3" />
    <circle cx="56" cy="56" r="4" fill="#DDA15E" />
    <circle cx="78" cy="56" r="11" fill="none" stroke="#DDA15E" stroke-width="3" />
    <circle cx="78" cy="56" r="4" fill="#DDA15E" />
    
    <!-- Top row logs -->
    <circle cx="45" cy="38" r="11" fill="none" stroke="#D8F3DC" stroke-width="3" />
    <circle cx="45" cy="38" r="4" fill="#D8F3DC" />
    <circle cx="67" cy="38" r="11" fill="none" stroke="#D8F3DC" stroke-width="3" />
    <circle cx="67" cy="38" r="4" fill="#D8F3DC" />

    <!-- Measurement dimension arrows -->
    <!-- Vertical indicator line (Hm) -->
    <line x1="14" y1="28" x2="14" y2="68" stroke="#52B788" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 11 34 L 14 27 L 17 34" fill="none" stroke="#52B788" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 11 62 L 14 69 L 17 62" fill="none" stroke="#52B788" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Horizontal base indicator line (C & L) -->
    <line x1="24" y1="78" x2="88" y2="78" stroke="#52B788" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 30 75 L 23 78 L 30 81" fill="none" stroke="#52B788" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 82 75 L 89 78 L 82 81" fill="none" stroke="#52B788" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Small leaf accent -->
    <path d="M 72 22 C 78 16 88 18 88 18 C 88 18 88 28 80 30 C 76 31 72 27 72 22 Z" fill="#74C69D" />
  </g>

  <!-- Typography -->
  <g transform="translate(130, 24)">
    <text x="0" y="38" font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#1B4D3E" letter-spacing="-0.5">
      CUBAGEM
    </text>
    <text x="175" y="38" font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#2D6A4F" letter-spacing="-0.5">
      FLORESTAL
    </text>
    
    <text x="2" y="66" font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#52B788" letter-spacing="2.2" text-transform="uppercase">
      GESTÃO E CÁLCULO DE CARGAS DE MADEIRA
    </text>

    <!-- Operational Tag -->
    <rect x="0" y="76" width="135" height="18" rx="4" fill="#E8F5E9" />
    <text x="6" y="89" font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1B4D3E">
      ● 100% OFFLINE EM CAMPO
    </text>
  </g>
</svg>